<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growtech Admin Dashboard</title>
<style>
*{box-sizing:border-box;font-family:'Poppins',sans-serif;margin:0;padding:0}
body{background:#eef5ef;padding:30px}
.container{max-width:1400px;margin:auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 15px 40px rgba(0,0,0,.12)}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:30px}
.logo{display:flex;align-items:center;gap:15px}
.logo-circle{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#27ae60,#2ecc71);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;font-weight:bold}
.logo h1{font-size:30px;color:#1b4332}
.logo p{color:#666;font-size:14px}
.login-panel{background:#f4faf5;border:1px solid #cfe9d7;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.login-panel input{padding:10px 12px;border:1px solid #c8d8cb;border-radius:10px;min-width:140px}
.user-chip{background:#1b4332;color:#fff;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;border:none;cursor:pointer}
button{padding:12px 18px;border:none;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600}
.save-btn{background:#27ae60;color:#fff}
.logout-btn{background:#9b59b6;color:white}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:30px}
.card{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;padding:22px;border-radius:16px;box-shadow:0 8px 20px rgba(39,174,96,.25)}
.card h3{font-size:16px;margin-bottom:10px;font-weight:500}
.card span{font-size:30px;font-weight:bold}
.table-card{background:#fff;padding:25px;border-radius:18px;overflow:auto;border:1px solid #e5efe6;margin-top:20px}
.table-card h2{margin-bottom:20px;color:#1b4332}
table{width:100%;border-collapse:collapse;min-width:1000px}
thead{background:#1b4332;color:#fff}
th,td{padding:14px;text-align:center}
tbody tr:nth-child(even){background:#f4f8f5}
tbody tr:hover{background:#e9f7ef}
.status{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.pending{background:#fff4cc;color:#a36a00}
.returned{background:#d4edda;color:#1e7e34}
@media(max-width:768px){.container{padding:20px}.header{flex-direction:column;align-items:flex-start}.button-row{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">
<div class="logo-circle">🌱</div>
<div>
<h1>Growtech Admin Dashboard</h1>
<p>Multiuser governance and audit overview</p>
</div>
</div>
<div class="login-panel">
  <input type="text" id="usernameInput" placeholder="Username">
  <input type="password" id="passwordInput" placeholder="Password">
  <button class="save-btn" type="button" id="loginBtn">Login</button>
  <button class="logout-btn" type="button" id="logoutBtn" style="display:none;">Logout</button>
  <button type="button" class="user-chip" id="currentUser">Not signed in</button>
</div>
</header>
<div class="dashboard">
<div class="card"><h3>Total Users</h3><span id="totalUsers">0</span></div>
<div class="card"><h3>Admins</h3><span id="adminCount">0</span></div>
<div class="card"><h3>Staff</h3><span id="staffCount">0</span></div>
<div class="card"><h3>Records</h3><span id="totalRecords">0</span></div>
<div class="card"><h3>Pending Returns</h3><span id="pendingRecords">0</span></div>
<div class="card"><h3>Damaged Trays</h3><span id="damagedRecords">0</span></div>
</div>
<div class="table-card">
<h2>User Governance</h2>
<table id="usersTable">
<thead><tr><th>User ID</th><th>Username</th><th>Role</th></tr></thead>
<tbody></tbody>
</table>
</div>
<div class="table-card">
<h2>Audit Trail</h2>
<table id="auditTable">
<thead><tr><th>Record ID</th><th>Customer</th><th>Created By</th><th>Updated At</th><th>Location</th><th>Status</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
<script>
let currentUser = null;

async function fetchJSON(url, options = {}) {
  const response = await fetch(url, {
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {})
    },
    ...options
  });
  const text = await response.text();
  const data = text ? JSON.parse(text) : {};
  if (!response.ok) throw new Error(data.message || 'Request failed');
  return data;
}

async function loginUser() {
  const username = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if (!username || !password) { alert('Enter both username and password.'); return; }
  try {
    const data = await fetchJSON('/api/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    currentUser = data.user;
    document.getElementById('currentUser').textContent = `Signed in as ${currentUser.username}`;
    document.getElementById('logoutBtn').style.display = 'inline-block';
    document.getElementById('loginBtn').style.display = 'none';
    document.getElementById('usernameInput').style.display = 'none';
    document.getElementById('passwordInput').style.display = 'none';
    await loadDashboard();
  } catch (error) {
    alert(error.message);
  }
}

async function logoutUser() {
  try {
    await fetchJSON('/api/logout', { method: 'POST' });
    currentUser = null;
    document.getElementById('currentUser').textContent = 'Not signed in';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('loginBtn').style.display = 'inline-block';
    document.getElementById('usernameInput').style.display = 'inline-block';
    document.getElementById('passwordInput').style.display = 'inline-block';
    await loadDashboard();
  } catch (error) {
    alert(error.message);
  }
}

async function getCurrentUser() {
  try {
    const data = await fetchJSON('/api/me');
    currentUser = data.user;
    document.getElementById('currentUser').textContent = `Signed in as ${currentUser.username}`;
    document.getElementById('logoutBtn').style.display = 'inline-block';
    document.getElementById('loginBtn').style.display = 'none';
    document.getElementById('usernameInput').style.display = 'none';
    document.getElementById('passwordInput').style.display = 'none';
  } catch (error) {
    currentUser = null;
    document.getElementById('currentUser').textContent = 'Not signed in';
  }
}

async function loadDashboard() {
  if (!currentUser || currentUser.role !== 'admin') {
    document.getElementById('totalUsers').textContent = 0;
    document.getElementById('adminCount').textContent = 0;
    document.getElementById('staffCount').textContent = 0;
    document.getElementById('totalRecords').textContent = 0;
    document.getElementById('pendingRecords').textContent = 0;
    document.getElementById('damagedRecords').textContent = 0;
    document.querySelector('#usersTable tbody').innerHTML = '<tr><td colspan="3">Admin access required</td></tr>';
    document.querySelector('#auditTable tbody').innerHTML = '<tr><td colspan="6">Admin access required</td></tr>';
    return;
  }

  try {
    const summary = await fetchJSON('/api/admin/summary');
    document.getElementById('totalUsers').textContent = summary.total_users;
    document.getElementById('adminCount').textContent = summary.admin_count;
    document.getElementById('staffCount').textContent = summary.staff_count;
    document.getElementById('totalRecords').textContent = summary.total_records;
    document.getElementById('pendingRecords').textContent = summary.pending_records;
    document.getElementById('damagedRecords').textContent = summary.damaged_trays;

    const users = await fetchJSON('/api/users');
    const userRows = document.querySelector('#usersTable tbody');
    userRows.innerHTML = '';
    users.forEach(user => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${user.id}</td><td>${user.username}</td><td>${user.role}</td>`;
      userRows.appendChild(row);
    });

    const auditRows = await fetchJSON('/api/audit');
    const auditTable = document.querySelector('#auditTable tbody');
    auditTable.innerHTML = '';
    auditRows.forEach(row => {
      const status = row.dateReturned ? 'Returned' : 'Pending';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.id}</td>
        <td>${row.name}</td>
        <td>${row.createdBy}</td>
        <td>${row.updatedAt}</td>
        <td>${row.location}</td>
        <td><span class="status ${status === 'Pending' ? 'pending' : 'returned'}">${status}</span></td>
      `;
      auditTable.appendChild(tr);
    });
  } catch (error) {
    alert(error.message);
  }
}

document.getElementById('loginBtn').addEventListener('click', loginUser);
document.getElementById('logoutBtn').addEventListener('click', logoutUser);
document.getElementById('currentUser').addEventListener('click', () => {
  if (!currentUser) {
    document.getElementById('usernameInput').focus();
  }
});
window.addEventListener('DOMContentLoaded', async () => {
  await getCurrentUser();
  await loadDashboard();
});
</script>
</body>
</html>
